# version: "2.4"
services:
    dlms-cim-meter1:
        build:
            context: .
            target: demo
        entrypoint: 
            - /tmp/Metersim
            - "M1001"
        expose:
            - "4059/tcp"
        networks:
            meternet:
        sysctls:
          net.ipv6.conf.all.disable_ipv6: 0
        volumes:
          - ./dlms-cim/build/src:/tmp


    dlms-cim-meter2:
        build:
            context: .
            target: demo
        entrypoint: 
            - /tmp/Metersim 
            - "M1002"
        expose:
            - "4059/tcp"
        networks:
            meternet:
        sysctls:
          net.ipv6.conf.all.disable_ipv6: 0
        volumes:
          - ./dlms-cim/build/src:/tmp

    dlms-cim-docs:
        build:
            context: .
            target: docserver
        ports:
                - "8080:80"
        networks:
            - docnet
        volumes:
          - ./dlms-cim/build/doc/html:/usr/share/nginx/html

    dlms-cim-hes:
        build:
            context: .
            target: demo
        entrypoint: 
            - /tmp/HESsim
            - "8888"
            - dlms-cim-meter1
            - dlms-cim-meter2
        expose:
            - "8888/tcp"
        networks:
            hesnet:
            meternet:
        sysctls:
          net.ipv6.conf.all.disable_ipv6: 0
        volumes:
          - ./dlms-cim/build/src:/tmp

    dlms-cim-cis:
        build:
            context: .
            target: demo
        entrypoint: 
            - /tmp/CISsim
            - "http://dlms-cim-hes:8888"
            - "http://dlms-cim-cis"
        depends_on:
            - dlms-cim-hes
        networks:
            - hesnet
        sysctls:
          net.ipv6.conf.all.disable_ipv6: 1
        volumes:
          - ./dlms-cim/build/src:/tmp

networks:
    docnet:
    hesnet:
    meternet:
        enable_ipv6: true
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 2001:3200:3200::/64

